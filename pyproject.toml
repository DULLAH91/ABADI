[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-media-hub"
version = "0.3.0"
description = "AI Media Hub execution and orchestration core"
requires-python = ">=3.11"
dependencies = [
  "mcp>=2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
